name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist
        shell: bash
        run: |
          python -m build --sdist
          twine check dist/*
      - name: Add the published Windows wheel from PyPI
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          python -m pip download "sunnynet-cx==$ver" --no-deps \
            --only-binary=:all: --platform win_amd64 \
            --python-version 3.12 --implementation py -d dist || true
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: List artifacts
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Pick release notes
        id: notes
        shell: bash
        run: |
          f="docs/RELEASE_${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi
      - name: Replace existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false || true
      - name: Create release
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          name: SunnyNet ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*
      - name: Create release (generated notes)
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          name: SunnyNet ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*