name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # sdist 只由一个平台产出, 否则同名 tar.gz 会互相覆盖
          - os: ubuntu-latest
            build_args: ""
          - os: windows-latest
            build_args: "--wheel"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build ${{ matrix.build_args }}
      - name: Show prebuilt contents
        shell: bash
        run: |
          python -c "import zipfile,glob; [print(f,'->',sum('_prebuilt' in n for n in zipfile.ZipFile(f).namelist()),'prebuilt') for f in glob.glob('dist/*.whl')]"
      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: List artifacts
        run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true